name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.1.0-alpha.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine the version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(node -p "require('./package.json').version")
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The artefact must be built from exactly the tagged state.
          test "$tag" = "v$version" \
            || (echo "::error::Tag $tag does not match package.json version $version" && exit 1)
          case "$version" in
            *-alpha*|*-beta*|*-rc*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)                      echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Full check
        # Exactly what CI runs, repeated here so nothing is published that was not verified.
        run: npm run check

      - name: Generated files are in sync
        run: |
          npm run generate
          git diff --exit-code \
            || (echo "::error::Generated files are stale in the tagged commit." && exit 1)

      - name: Build the release artefacts
        run: npm run build:skill

      - name: Assemble the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Written to a file, never passed through the shell as a string: the notes
          # contain backticks and would otherwise be treated as command substitution.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/      { exit }
            found                  { print }
          ' CHANGELOG.md > release-notes.md

          checksum=$(cut -d' ' -f1 dist/chatgpt/skill.zip.sha256)
          cat >> release-notes.md <<NOTES

          ---

          ### Artefakte

          | Datei | Inhalt |
          |---|---|
          | \`skill.zip\` | Self-contained ChatGPT-Skill inklusive Floorplan-Core. Node >= 20, kein \`npm install\`, kein Git-Clone, kein Netz. |
          | \`skill.zip.sha256\` | Prüfsumme des Archivs. |

          \`\`\`bash
          sha256sum -c skill.zip.sha256
          unzip -q skill.zip -d ./skill
          node ./skill/floorplan/scripts/floorplan.js --version
          \`\`\`

          SHA-256: \`$checksum\`
          NOTES

          # Strip the leading indentation the heredoc carries for readability.
          sed -i 's/^          //' release-notes.md
          test -s release-notes.md || (echo "::error::Release notes are empty — is there a CHANGELOG entry for $VERSION?" && exit 1)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then
            flags="--prerelease"
          fi
          gh release create "$TAG" \
            dist/chatgpt/skill.zip \
            dist/chatgpt/skill.zip.sha256 \
            --title "$TAG" \
            --notes-file release-notes.md \
            $flags

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: dist/chatgpt/
          retention-days: 90
